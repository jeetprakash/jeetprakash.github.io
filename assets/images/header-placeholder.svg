<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern Lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="8 8"/>
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="8 8"/>
  
  <!-- Top Accent Bar -->
  <rect width="1200" height="10" fill="url(#accentGrad)"/>
  
  <!-- Code Card Window Mockup -->
  <rect x="250" y="140" width="700" height="350" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.05))"/>
  
  <!-- Window Controls -->
  <circle cx="290" cy="180" r="8" fill="#ef4444"/>
  <circle cx="315" cy="180" r="8" fill="#f59e0b"/>
  <circle cx="340" cy="180" r="8" fill="#10b981"/>
  
  <!-- Title / Code Text Mockup -->
  <text x="290" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Developer Blog Header Image</text>
  
  <text x="290" y="295" font-family="'Fira Code', 'Courier New', monospace" font-size="18" fill="#3b82f6">const <tspan fill="#8b5cf6">post</tspan> = {</text>
  <text x="320" y="330" font-family="'Fira Code', 'Courier New', monospace" font-size="18" fill="#64748b">title: <tspan fill="#10b981">'Lorem Ipsum: A Comprehensive Developer Post Guide'</tspan>,</text>
  <text x="320" y="365" font-family="'Fira Code', 'Courier New', monospace" font-size="18" fill="#64748b">tags: [<tspan fill="#f59e0b">'#devMusings'</tspan>, <tspan fill="#ef4444">'#devRants'</tspan>],</text>
  <text x="320" y="400" font-family="'Fira Code', 'Courier New', monospace" font-size="18" fill="#64748b">status: <tspan fill="#3b82f6">'published'</tspan></text>
  <text x="290" y="435" font-family="'Fira Code', 'Courier New', monospace" font-size="18" fill="#3b82f6">};</text>
</svg>
