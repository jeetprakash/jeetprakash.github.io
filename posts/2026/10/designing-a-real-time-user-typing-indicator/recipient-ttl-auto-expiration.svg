<svg viewBox="0 0 920 370" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <filter id="shadow-ttl" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arr-ttl-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arr-ttl-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706" />
    </marker>
    <marker id="arr-ttl-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669" />
    </marker>
    <marker id="arr-ttl-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="370" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title Banner -->
  <g transform="translate(250, 14)" filter="url(#shadow-ttl)">
    <rect width="420" height="34" rx="6" fill="#0f172a" />
    <text x="210" y="22" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">RECIPIENT-SIDE AUTO-EXPIRATION &amp; LEASE DECAY</text>
  </g>

  <!-- Row 1: Incoming Wire Frames -->
  <g transform="translate(20, 60)">
    <rect width="135" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="67" y="24" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Incoming Events</text>

    <!-- Wire line -->
    <line x1="155" y1="19" x2="880" y2="19" stroke="#cbd5e1" stroke-width="1.8" />

    <!-- Event 1: typing_start -->
    <g transform="translate(180, 0)" filter="url(#shadow-ttl)">
      <rect width="135" height="38" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="67" y="18" font-size="10" font-family="monospace" font-weight="700" fill="#1e40af" text-anchor="middle">[typing_start]</text>
      <text x="67" y="31" font-size="8.5" fill="#3b82f6" text-anchor="middle">Arrival at t = 0.0s</text>
    </g>

    <!-- Event 2: typing_start (Heartbeat) -->
    <g transform="translate(470, 0)" filter="url(#shadow-ttl)">
      <rect width="135" height="38" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="67" y="18" font-size="10" font-family="monospace" font-weight="700" fill="#1e40af" text-anchor="middle">[typing_start]</text>
      <text x="67" y="31" font-size="8.5" fill="#3b82f6" text-anchor="middle">Heartbeat at t = 1.8s</text>
    </g>

    <!-- Quiet / Idle period -->
    <g transform="translate(730, 2)">
      <rect width="140" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
      <text x="70" y="21" font-size="9.5" fill="#64748b" text-anchor="middle">(No more events sent)</text>
    </g>
  </g>

  <!-- Connectors from Events to Recipient State -->
  <line x1="267" y1="98" x2="267" y2="120" stroke="#059669" stroke-width="2" marker-end="url(#arr-ttl-green)" />
  <line x1="557" y1="98" x2="557" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-ttl-blue)" />
  <line x1="820" y1="98" x2="820" y2="120" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-ttl-red)" />

  <!-- Row 2: Recipient UI State & Actions -->
  <g transform="translate(20, 125)">
    <rect width="135" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="67" y="28" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Recipient UI State</text>

    <!-- State 1: Show Banner -->
    <g transform="translate(180, 0)" filter="url(#shadow-ttl)">
      <rect width="175" height="46" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#15803d">&#10003; Show "typing..." Banner</text>
      <text x="12" y="36" font-size="9" fill="#166534">Arm local timer = 3.0s</text>
    </g>

    <!-- State 2: Reset Timer -->
    <g transform="translate(470, 0)" filter="url(#shadow-ttl)">
      <rect width="175" height="46" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#1d4ed8">&#8635; Reset Timer</text>
      <text x="12" y="36" font-size="9" fill="#3b82f6">Re-arm lease countdown to 3.0s</text>
    </g>

    <!-- State 3: Hide Banner -->
    <g transform="translate(730, 0)" filter="url(#shadow-ttl)">
      <rect width="150" height="46" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#991b1b">&#10007; Hide Banner</text>
      <text x="12" y="36" font-size="9" fill="#dc2626">Lease expired gracefully</text>
    </g>
  </g>

  <!-- Row 3: TTL Countdown Progress -->
  <g transform="translate(20, 195)">
    <rect width="135" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="67" y="28" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">TTL Countdown</text>
    <text x="67" y="46" font-size="9" fill="#64748b" text-anchor="middle">Local Lease Clock</text>

    <!-- Segment 1: 3.0s down to 1.2s -->
    <g transform="translate(180, 0)">
      <rect width="260" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <!-- Pills inside -->
      <rect x="15" y="15" width="46" height="26" rx="4" fill="#f0fdf4" stroke="#86efac" />
      <text x="38" y="32" font-size="10" font-family="monospace" font-weight="700" fill="#15803d" text-anchor="middle">3.0s</text>
      <path d="M 68 28 L 86 28" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-ttl-amber)" />

      <rect x="95" y="15" width="46" height="26" rx="4" fill="#fffbeb" stroke="#fde68a" />
      <text x="118" y="32" font-size="10" font-family="monospace" font-weight="700" fill="#b45309" text-anchor="middle">2.0s</text>
      <path d="M 148 28 L 166 28" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-ttl-amber)" />

      <rect x="175" y="15" width="46" height="26" rx="4" fill="#fffbeb" stroke="#fde68a" />
      <text x="198" y="32" font-size="10" font-family="monospace" font-weight="700" fill="#b45309" text-anchor="middle">1.2s</text>

      <text x="130" y="54" font-size="8.5" fill="#64748b" text-anchor="middle">Countdown decays monotonically</text>
    </g>

    <!-- Reset Indicator Arrow -->
    <path d="M 445 28 L 465 28" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-ttl-blue)" />

    <!-- Segment 2: 3.0s down to 0.0s -->
    <g transform="translate(470, 0)">
      <rect width="410" height="65" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      
      <rect x="15" y="15" width="46" height="26" rx="4" fill="#f0fdf4" stroke="#86efac" />
      <text x="38" y="32" font-size="10" font-family="monospace" font-weight="700" fill="#15803d" text-anchor="middle">3.0s</text>
      <path d="M 68 28 L 86 28" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-ttl-amber)" />

      <rect x="95" y="15" width="46" height="26" rx="4" fill="#fffbeb" stroke="#fde68a" />
      <text x="118" y="32" font-size="10" font-family="monospace" font-weight="700" fill="#b45309" text-anchor="middle">2.0s</text>
      <path d="M 148 28 L 166 28" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-ttl-amber)" />

      <rect x="175" y="15" width="46" height="26" rx="4" fill="#fffbeb" stroke="#fde68a" />
      <text x="198" y="32" font-size="10" font-family="monospace" font-weight="700" fill="#b45309" text-anchor="middle">1.0s</text>
      <path d="M 228 28 L 246 28" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-ttl-red)" />

      <rect x="255" y="15" width="46" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5" />
      <text x="278" y="32" font-size="10" font-family="monospace" font-weight="700" fill="#dc2626" text-anchor="middle">0.0s</text>

      <!-- Dismiss label -->
      <rect x="312" y="16" width="85" height="24" rx="4" fill="#fee2e2" />
      <text x="354" y="32" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">UI Dismissed</text>

      <text x="205" y="54" font-size="8.5" fill="#64748b" text-anchor="middle">No refresh arrives &#8594; Timer runs out cleanly to 0</text>
    </g>
  </g>

  <!-- Lease Reset Callout Box -->
  <g transform="translate(320, 275)">
    <rect width="320" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d" />
    <text x="160" y="17" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">&#8635; Heartbeat arrival at 1.2s resets TTL back to 3.0s</text>
  </g>

  <!-- Bottom Guarantee Banner -->
  <rect x="20" y="320" width="880" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="460" y="341" font-size="10" font-weight="600" fill="#1e40af" text-anchor="middle">&#128737; Crash Resiliency Guarantee: If the sender app crashes mid-sentence, Bob's client decays the lease within 3s. Zero "ghost" indicators!</text>
</svg>
