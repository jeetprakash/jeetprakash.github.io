<svg viewBox="0 0 760 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-3px); }
      }
      .dot-1 { animation: bounce 1.2s infinite ease-in-out; }
      .dot-2 { animation: bounce 1.2s infinite ease-in-out 0.2s; }
      .dot-3 { animation: bounce 1.2s infinite ease-in-out 0.4s; }
    </style>
    <filter id="shadow-ui" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="760" height="420" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Chat Mockup Window -->
  <g transform="translate(140, 25)" filter="url(#shadow-ui)">
    <!-- Device Frame / Card -->
    <rect width="480" height="370" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Chat Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 466 0 Q 480 0 480 14 L 480 64 L 0 64 Z" fill="#ffffff" />
    <line x1="0" y1="64" x2="480" y2="64" stroke="#e2e8f0" stroke-width="1" />

    <!-- Back Arrow -->
    <path d="M 22 32 L 32 23 M 22 32 L 32 41" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Avatar Circle -->
    <circle cx="56" cy="32" r="18" fill="#2563eb" />
    <text x="56" y="37" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>

    <!-- Name & Presence Status -->
    <text x="86" y="27" font-size="14" font-weight="700" fill="#0f172a">Alice</text>
    
    <!-- Typing indicator with dots in header -->
    <g transform="translate(86, 44)">
      <text x="0" y="0" font-size="12" font-weight="600" fill="#059669">typing</text>
      <circle cx="42" cy="-4" r="2.5" fill="#059669" class="dot-1" />
      <circle cx="49" cy="-4" r="2.5" fill="#059669" class="dot-2" />
      <circle cx="56" cy="-4" r="2.5" fill="#059669" class="dot-3" />
    </g>

    <!-- Header Action Icons (Video, Phone, Menu) -->
    
    <!-- Three Dots Menu -->
    <circle cx="462" cy="27" r="2" fill="#64748b" />
    <circle cx="462" cy="33" r="2" fill="#64748b" />
    <circle cx="462" cy="39" r="2" fill="#64748b" />

    <!-- Chat Canvas Body -->
    <rect x="1" y="65" width="478" height="240" fill="#f8fafc" />

    <!-- Date Chip -->
    <rect x="210" y="80" width="60" height="20" rx="10" fill="#e2e8f0" />
    <text x="240" y="94" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">TODAY</text>

    <!-- Sent Message Bubble (User to Alice) -->
    <g transform="translate(190, 115)">
      <path d="M 8 0 L 260 0 Q 272 0 272 12 L 272 48 Q 272 60 260 60 L 8 60 Q 0 60 0 48 L 0 12 Q 0 0 8 0 Z" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1" />
      <text x="16" y="26" font-size="13" font-weight="500" fill="#0f172a">Hey, are you free for a call?</text>
      <!-- Time and Checkmark -->
      <text x="210" y="48" font-size="10.5" fill="#64748b">10:42</text>
      <!-- Double Checkmark -->
      <path d="M 243 45 L 246 48 L 252 42" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-linecap="round" />
      <path d="M 247 45 L 250 48 L 256 42" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- Callout Highlight / Annotation -->
    <g transform="translate(25, 195)">
      <rect width="210" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#166534">Real-Time Presence State:</text>
      <text x="12" y="38" font-size="9.5" fill="#15803d">Banner appears under contact header</text>
      <path d="M 60 0 L 60 -125" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" />
      <circle cx="60" cy="-125" r="3" fill="#10b981" />
    </g>

    <!-- Bottom Input Bar -->
    <line x1="0" y1="305" x2="480" y2="305" stroke="#e2e8f0" stroke-width="1" />
    <path d="M 0 306 L 480 306 L 480 356 Q 480 370 466 370 L 14 370 Q 0 370 0 356 Z" fill="#ffffff" />

    <!-- Text Input Box -->
    <rect x="15" y="318" width="400" height="38" rx="19" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Smiley Icon -->
    <circle cx="34" cy="337" r="9" fill="none" stroke="#64748b" stroke-width="1.4" />
    <circle cx="31" cy="334" r="1" fill="#64748b" />
    <circle cx="37" cy="334" r="1" fill="#64748b" />
    <path d="M 30 339 Q 34 343 38 339" fill="none" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />

    <text x="52" y="342" font-size="12" fill="#94a3b8">Message...</text>

    <!-- Send Button (Circle with Send Icon) -->
    <circle cx="445" cy="337" r="18" fill="#10b981" />
    <path d="M 439 331 L 452 337 L 439 343 L 442 337 Z" fill="#ffffff" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round" />
  </g>
</svg>
