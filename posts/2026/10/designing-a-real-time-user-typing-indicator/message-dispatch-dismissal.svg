<svg viewBox="0 0 920 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <filter id="shadow-msg" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arr-m-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arr-m-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669" />
    </marker>
    <marker id="arr-m-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="340" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title Banner -->
  <g transform="translate(250, 14)" filter="url(#shadow-msg)">
    <rect width="420" height="34" rx="6" fill="#0f172a" />
    <text x="210" y="22" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">EDGE CASE: IMMEDIATE DISMISSAL ON MESSAGE DISPATCH</text>
  </g>

  <!-- Row 1: User A (Sender) -->
  <g transform="translate(20, 60)">
    <rect width="140" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" />
    <text x="70" y="26" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">User A (Sender)</text>

    <!-- State 1: Typing -->
    <g transform="translate(160, 0)" filter="url(#shadow-msg)">
      <rect width="180" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="90" y="26" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">&#9998; User types text in box...</text>
    </g>

    <!-- Arrow to Send -->
    <path d="M 350 21 L 430 21" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-m-blue)" />

    <!-- State 2: Taps Send -->
    <g transform="translate(440, 0)" filter="url(#shadow-msg)">
      <rect width="200" height="42" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" />
      <text x="100" y="26" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">&#10148; User Taps "Send" Button</text>
    </g>
  </g>

  <!-- Downward trigger connector from Taps Send to Chat Message -->
  <path d="M 560 102 L 560 135" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-m-green)" />

  <!-- Row 2: Network Wire -->
  <g transform="translate(20, 135)">
    <rect width="140" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="70" y="27" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Network Wire</text>

    <!-- Frame 1: typing_start -->
    <g transform="translate(180, 2)" filter="url(#shadow-msg)">
      <rect width="150" height="40" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="75" y="20" font-size="10" font-family="monospace" font-weight="700" fill="#1e40af" text-anchor="middle">[typing_start]</text>
      <text x="75" y="32" font-size="8.5" fill="#3b82f6" text-anchor="middle">Dispatched during typing</text>
    </g>

    <!-- Frame 2: chat_message -->
    <g transform="translate(470, 2)" filter="url(#shadow-msg)">
      <rect width="180" height="40" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" />
      <text x="90" y="20" font-size="10" font-family="monospace" font-weight="700" fill="#15803d" text-anchor="middle">[chat_message payload]</text>
      <text x="90" y="32" font-size="8.5" fill="#166534" text-anchor="middle">Dispatched on tap</text>
    </g>
  </g>

  <!-- Connectors from Wire to Recipient -->
  <line x1="255" y1="179" x2="255" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-m-blue)" />
  <line x1="560" y1="179" x2="560" y2="210" stroke="#059669" stroke-width="2" marker-end="url(#arr-m-green)" />

  <!-- Row 3: User B (Receiver UI) -->
  <g transform="translate(20, 215)">
    <rect width="140" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="70" y="28" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">User B (Receiver)</text>
    <text x="70" y="44" font-size="9" fill="#15803d" text-anchor="middle">Chat UI State</text>

    <!-- State 1: Shows banner -->
    <g transform="translate(170, 0)" filter="url(#shadow-msg)">
      <rect width="170" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="85" y="25" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">&#128065; Shows "typing..."</text>
      <text x="85" y="44" font-size="9" fill="#64748b" text-anchor="middle">Banner active in header</text>
    </g>

    <!-- Arrow from State 1 to Dual Actions -->
    <path d="M 350 30 L 400 30" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Action 1: Render Message -->
    <g transform="translate(415, 0)" filter="url(#shadow-msg)">
      <rect width="210" height="60" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" />
      <text x="15" y="24" font-size="10.5" font-weight="700" fill="#15803d">&#10003; 1. Render Message</text>
      <text x="15" y="44" font-size="9" fill="#166534">Displays incoming chat bubble</text>
    </g>

    <!-- Action 2: Immediate Dismissal -->
    <g transform="translate(640, 0)" filter="url(#shadow-msg)">
      <rect width="235" height="60" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
      <text x="15" y="24" font-size="10.5" font-weight="700" fill="#991b1b">&#10007; 2. Proactive Dismissal</text>
      <text x="15" y="44" font-size="9" fill="#dc2626">Aborts active TTL timer immediately</text>
    </g>
  </g>

  <!-- Bottom UX Comparison Note -->
  <rect x="20" y="295" width="880" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="460" y="314" font-size="9.5" fill="#334155" text-anchor="middle"><tspan font-weight="700" fill="#0f172a">UX Advantage:</tspan> Prevents the awkward glitch of showing a delivered message alongside a lingering 3-second "typing..." indicator.</text>
</svg>
