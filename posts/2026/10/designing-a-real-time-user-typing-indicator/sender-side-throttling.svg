<svg viewBox="0 0 920 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <filter id="shadow-throt" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arr-t-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669" />
    </marker>
    <marker id="arr-t-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="340" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Title Banner -->
  <g transform="translate(260, 14)" filter="url(#shadow-throt)">
    <rect width="400" height="34" rx="6" fill="#0f172a" />
    <text x="200" y="22" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">SENDER-SIDE CLIENT THROTTLING TIMELINE</text>
  </g>

  <!-- Row 1: Keystrokes -->
  <g transform="translate(20, 60)">
    <rect width="125" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="62" y="22" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Keystrokes</text>

    <!-- Keys Stream -->
    <g transform="translate(150, 0)">
      <!-- First Burst: H e l l o -->
      <g transform="translate(0, 0)">
        <rect width="28" height="34" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
        <text x="14" y="22" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">H</text>
      </g>
      <g transform="translate(36, 0)">
        <rect width="28" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="14" y="22" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">e</text>
      </g>
      <g transform="translate(72, 0)">
        <rect width="28" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="14" y="22" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">l</text>
      </g>
      <g transform="translate(108, 0)">
        <rect width="28" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="14" y="22" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">l</text>
      </g>
      <g transform="translate(144, 0)">
        <rect width="28" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="14" y="22" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">o</text>
      </g>

      <text x="200" y="22" font-size="14" font-weight="700" fill="#94a3b8">...</text>

      <!-- Second Burst: w o r l d -->
      <g transform="translate(235, 0)">
        <rect width="28" height="34" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
        <text x="14" y="22" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">w</text>
      </g>
      <g transform="translate(271, 0)">
        <rect width="28" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="14" y="22" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">o</text>
      </g>
      <g transform="translate(307, 0)">
        <rect width="28" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="14" y="22" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">r</text>
      </g>
      <g transform="translate(343, 0)">
        <rect width="28" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="14" y="22" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">l</text>
      </g>
      <g transform="translate(379, 0)">
        <rect width="28" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="14" y="22" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">d</text>
      </g>

      <!-- Paused label -->
      <rect x="430" y="4" width="160" height="26" rx="4" fill="#fef3c7" stroke="#fcd34d" />
      <text x="510" y="21" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="middle">(User finishes typing / pauses)</text>
    </g>
  </g>

  <!-- Connectors from Keystrokes to Throttle -->
  <line x1="184" y1="94" x2="184" y2="120" stroke="#059669" stroke-width="1.8" />
  <line x1="419" y1="94" x2="419" y2="120" stroke="#059669" stroke-width="1.8" />

  <!-- Row 2: Throttle Filter State -->
  <g transform="translate(20, 120)">
    <rect width="125" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="62" y="23" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Throttle Filter</text>

    <!-- Action 1: FIRE -->
    <g transform="translate(150, 0)">
      <rect width="70" height="36" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" />
      <text x="35" y="22" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">FIRE</text>
    </g>

    <!-- Suppressed Window 1 -->
    <g transform="translate(230, 0)">
      <rect width="145" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
      <text x="72" y="17" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">SUPPRESSED</text>
      <text x="72" y="29" font-size="8.5" fill="#94a3b8" text-anchor="middle">Window Active (1.8s)</text>
    </g>

    <!-- Arrow to Fire 2 -->
    <path d="M 378 18 L 392 18" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-t-green)" />

    <!-- Action 2: FIRE -->
    <g transform="translate(395, 0)">
      <rect width="70" height="36" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" />
      <text x="35" y="22" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">FIRE</text>
    </g>

    <!-- Suppressed Window 2 -->
    <g transform="translate(475, 0)">
      <rect width="130" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
      <text x="65" y="17" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">SUPPRESSED</text>
      <text x="65" y="29" font-size="8.5" fill="#94a3b8" text-anchor="middle">Window Active (1.8s)</text>
    </g>

    <!-- Arrow to Idle -->
    <path d="M 608 18 L 622 18" fill="none" stroke="#64748b" stroke-width="1.5" />

    <!-- Idle state -->
    <g transform="translate(625, 0)">
      <rect width="140" height="36" rx="5" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="70" y="22" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">IDLE (No Events)</text>
    </g>
  </g>

  <!-- Connectors from Throttle to Wire Payloads -->
  <line x1="185" y1="156" x2="185" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-t-blue)" />
  <line x1="430" y1="156" x2="430" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-t-blue)" />

  <!-- Row 3: Wire Payloads -->
  <g transform="translate(20, 190)">
    <rect width="125" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="62" y="26" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Wire Payload</text>

    <!-- Payload 1 -->
    <g transform="translate(145, 0)" filter="url(#shadow-throt)">
      <rect width="140" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="70" y="20" font-size="10.5" font-family="monospace" font-weight="700" fill="#1e40af" text-anchor="middle">[typing_start]</text>
      <text x="70" y="34" font-size="8.5" fill="#3b82f6" text-anchor="middle">Initial trigger frame</text>
    </g>

    <!-- Payload 2 -->
    <g transform="translate(390, 0)" filter="url(#shadow-throt)">
      <rect width="140" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="70" y="20" font-size="10.5" font-family="monospace" font-weight="700" fill="#1e40af" text-anchor="middle">[typing_start]</text>
      <text x="70" y="34" font-size="8.5" fill="#3b82f6" text-anchor="middle">Heartbeat lease renewal</text>
    </g>

    <!-- Quiet Network Baseline -->
    <line x1="545" y1="21" x2="865" y2="21" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="705" y="16" font-size="9.5" fill="#64748b" text-anchor="middle">&#8212; Quiet Socket: Zero network packets dispatched &#8212;</text>
  </g>

  <!-- Row 4: Timestamps & Metric Strip -->
  <g transform="translate(170, 255)">
    <!-- Time axis line -->
    <line x1="0" y1="10" x2="710" y2="10" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Marker 0.0s -->
    <circle cx="15" cy="10" r="3.5" fill="#0f172a" />
    <text x="15" y="28" font-size="10" font-family="monospace" font-weight="700" fill="#0f172a" text-anchor="middle">t = 0.0s</text>
    <text x="15" y="42" font-size="8.5" fill="#64748b" text-anchor="middle">First Keypress</text>

    <!-- Marker 1.8s -->
    <circle cx="260" cy="10" r="3.5" fill="#0f172a" />
    <text x="260" y="28" font-size="10" font-family="monospace" font-weight="700" fill="#0f172a" text-anchor="middle">t = 1.8s</text>
    <text x="260" y="42" font-size="8.5" fill="#64748b" text-anchor="middle">Heartbeat Elapsed</text>

    <!-- Marker 3.6s -->
    <circle cx="500" cy="10" r="3.5" fill="#0f172a" />
    <text x="500" y="28" font-size="10" font-family="monospace" font-weight="700" fill="#0f172a" text-anchor="middle">t = 3.6s</text>
    <text x="500" y="42" font-size="8.5" fill="#64748b" text-anchor="middle">Idle / Passive Stop</text>
  </g>

  <!-- Bottom Result Strip -->
  <rect x="20" y="306" width="880" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="460" y="322" font-size="10" font-weight="600" fill="#15803d" text-anchor="middle">&#10003; Performance Result: 11 rapid keystrokes coalesced into only 2 wire frames (~28 bytes each). Over 80% ingress reduction!</text>
</svg>
