<svg viewBox="0 0 920 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <filter id="shadow-d2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-blue-d2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange-d2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="360" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Root Card -->
  <g transform="translate(260, 20)" filter="url(#shadow-d2)">
    <rect width="400" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="400" height="26" rx="8" fill="#fee2e2" />
    <circle cx="20" cy="13" r="5" fill="#ef4444" />
    <text x="35" y="17" font-size="11" font-weight="700" fill="#991b1b" letter-spacing="0.04em">NETWORK PARTITION OCCURS (P)</text>
    <text x="200" y="46" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="middle">Physical Partition / Message Delay Between Nodes</text>
    <text x="200" y="61" font-size="9.5" fill="#64748b" text-anchor="middle">Partition Tolerance (P) is mandatory in distributed systems</text>
  </g>

  <!-- Connector Lines -->
  <!-- Left to CP -->
  <path d="M 380 90 L 230 145" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue-d2)" />
  <rect x="235" y="105" width="130" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd" />
  <text x="300" y="120" font-size="9.5" font-weight="700" fill="#1e40af" text-anchor="middle">Choose Consistency (CP)</text>

  <!-- Right to AP -->
  <path d="M 540 90 L 690 145" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-orange-d2)" />
  <rect x="555" y="105" width="130" height="22" rx="3" fill="#fef3c7" stroke="#fcd34d" />
  <text x="620" y="120" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">Choose Availability (AP)</text>

  <!-- Left Card: CP System -->
  <g transform="translate(30, 155)" filter="url(#shadow-d2)">
    <rect width="410" height="185" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" />
    <rect width="410" height="34" rx="8" fill="#eff6ff" />
    <text x="20" y="22" font-size="12" font-weight="700" fill="#1d4ed8">CP: Consistency over Availability</text>
    <text x="20" y="55" font-size="10" font-weight="700" fill="#0369a1">Core Behavior:</text>
    <text x="20" y="72" font-size="9.5" fill="#334155">Returns error or blocks until partition resolves to prevent stale reads.</text>
    <rect x="20" y="85" width="370" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="30" y="101" font-size="9.5" font-weight="600" fill="#0f172a">&#8226; Guarantee: Absolute data correctness / linearizability</text>
    <text x="30" y="117" font-size="9.5" fill="#dc2626">&#8226; Penalty: Unavailable for affected partition (errors / timeouts)</text>
    <text x="20" y="145" font-size="9" font-weight="700" fill="#64748b">TYPICAL USE CASES &amp; SYSTEMS:</text>
    <text x="20" y="162" font-size="9.5" font-weight="600" fill="#1e40af">Financial ledgers, ATM transactions, distributed locks (ZooKeeper, CockroachDB, HBase)</text>
  </g>

  <!-- Right Card: AP System -->
  <g transform="translate(480, 155)" filter="url(#shadow-d2)">
    <rect width="410" height="185" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" />
    <rect width="410" height="34" rx="8" fill="#fffbeb" />
    <text x="20" y="22" font-size="12" font-weight="700" fill="#b45309">AP: Availability over Consistency</text>
    <text x="20" y="55" font-size="10" font-weight="700" fill="#b45309">Core Behavior:</text>
    <text x="20" y="72" font-size="9.5" fill="#334155">Returns local data immediately, accepting potential temporary staleness.</text>
    <rect x="20" y="85" width="370" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="30" y="101" font-size="9.5" font-weight="600" fill="#0f172a">&#8226; Guarantee: 100% responsive uptime across all reachable nodes</text>
    <text x="30" y="117" font-size="9.5" fill="#d97706">&#8226; Penalty: Temporary inconsistency (reconciled asynchronously)</text>
    <text x="20" y="145" font-size="9" font-weight="700" fill="#64748b">TYPICAL USE CASES &amp; SYSTEMS:</text>
    <text x="20" y="162" font-size="9.5" font-weight="600" fill="#92400e">E-commerce shopping carts, social comments, telemetry (Cassandra, DynamoDB)</text>
  </g>
</svg>
