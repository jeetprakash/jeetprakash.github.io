<svg viewBox="0 0 920 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <filter id="shadow-d1" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <marker id="arrow-blue-d1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arrow-green-d1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669" />
    </marker>
    <marker id="arrow-red-d1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="400" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Panel 1: Normal Operation -->
  <g transform="translate(15, 15)" filter="url(#shadow-d1)">
    <rect width="430" height="370" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="430" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
    <circle cx="25" cy="19" r="6" fill="#10b981" />
    <text x="40" y="23" font-size="12" font-weight="700" fill="#166534" letter-spacing="0.04em">NORMAL OPERATION (HEALTHY NETWORK)</text>
    <rect x="145" y="55" width="140" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" />
    <text x="215" y="75" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Client Application</text>
    <text x="215" y="89" font-size="9.5" fill="#3b82f6" text-anchor="middle">Write X = 5 / Read X</text>
    <path d="M 180 97 L 110 145" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue-d1)" />
    <text x="125" y="115" font-size="9" font-weight="600" fill="#2563eb">Write X = 5</text>
    <rect x="30" y="150" width="150" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <rect x="30" y="150" width="150" height="26" rx="6" fill="#e2e8f0" />
    <text x="105" y="167" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Node A (Leader)</text>
    <rect x="45" y="188" width="120" height="28" rx="4" fill="#dcfce7" stroke="#86efac" />
    <text x="105" y="206" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">State: X = 5</text>
    <text x="105" y="245" font-size="9.5" fill="#64748b" text-anchor="middle">Acknowledged Write</text>
    <path d="M 180 205 L 250 205" fill="none" stroke="#059669" stroke-width="2.5" />
    <text x="215" y="195" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">Sync Link</text>
    <text x="215" y="222" font-size="8.5" fill="#10b981" text-anchor="middle">&lt;= Replicates =&gt;</text>
    <rect x="250" y="150" width="150" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <rect x="250" y="150" width="150" height="26" rx="6" fill="#e2e8f0" />
    <text x="325" y="167" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Node B (Follower)</text>
    <rect x="265" y="188" width="120" height="28" rx="4" fill="#dcfce7" stroke="#86efac" />
    <text x="325" y="206" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">State: X = 5</text>
    <text x="325" y="245" font-size="9.5" fill="#64748b" text-anchor="middle">Replicated Data</text>
    <rect x="30" y="290" width="370" height="55" rx="5" fill="#f0fdf4" stroke="#bbf7d0" />
    <text x="215" y="312" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">Guaranteed State: Consistency + Availability</text>
    <text x="215" y="330" font-size="9.5" fill="#166534" text-anchor="middle">Reads to either node return X = 5. Zero staleness, zero errors.</text>
  </g>

  <!-- Panel 2: Network Partition Occurs -->
  <g transform="translate(475, 15)" filter="url(#shadow-d1)">
    <rect width="430" height="370" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="430" height="38" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <circle cx="25" cy="19" r="6" fill="#ef4444" />
    <text x="40" y="23" font-size="12" font-weight="700" fill="#991b1b" letter-spacing="0.04em">NETWORK PARTITION OCCURS (THE DILEMMA)</text>
    <rect x="30" y="55" width="140" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" />
    <text x="100" y="73" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Client 1 (Write)</text>
    <text x="100" y="87" font-size="9.5" font-family="monospace" fill="#2563eb" text-anchor="middle">Write X = 5</text>
    <rect x="260" y="55" width="140" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" />
    <text x="330" y="73" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Client 2 (Read)</text>
    <text x="330" y="87" font-size="9.5" font-family="monospace" fill="#2563eb" text-anchor="middle">Read X = ?</text>
    <path d="M 100 97 L 100 142" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue-d1)" />
    <path d="M 330 97 L 330 142" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue-d1)" />
    <rect x="30" y="150" width="140" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <rect x="30" y="150" width="140" height="26" rx="6" fill="#e2e8f0" />
    <text x="100" y="167" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Node A</text>
    <rect x="40" y="188" width="120" height="28" rx="4" fill="#dcfce7" stroke="#86efac" />
    <text x="100" y="206" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Updated: X = 5</text>
    <text x="100" y="245" font-size="9" fill="#15803d" text-anchor="middle">Write Succeeded</text>
    <path d="M 170 205 L 260 205" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,4" />
    <circle cx="210" cy="205" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="210" y="210" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">X</text>
    <text x="210" y="232" font-size="8" font-weight="700" fill="#b91c1c" text-anchor="middle">LINK CUT</text>
    <rect x="260" y="150" width="140" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <rect x="260" y="150" width="140" height="26" rx="6" fill="#e2e8f0" />
    <text x="330" y="167" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Node B</text>
    <rect x="270" y="188" width="120" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5" />
    <text x="330" y="206" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">Stale: X = 0</text>
    <text x="330" y="245" font-size="9" fill="#b91c1c" text-anchor="middle">Cannot Sync with A</text>
    <rect x="25" y="280" width="380" height="75" rx="5" fill="#fef2f2" stroke="#fca5a5" />
    <text x="215" y="299" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">The Architectural Dilemma for Node B:</text>
    <text x="35" y="318" font-size="9.5" fill="#7f1d1d">&#8226; <tspan font-weight="700">Choice AP (Availability):</tspan> Return X = 0 (Immediate response, but stale data!)</text>
    <text x="35" y="336" font-size="9.5" fill="#7f1d1d">&#8226; <tspan font-weight="700">Choice CP (Consistency):</tspan> Error / Timeout (Prevents stale read, but rejects client!)</text>
  </g>
</svg>
